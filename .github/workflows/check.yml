name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `claude plugin validate` is skipped in CI: installing and running the
      # Claude Code CLI needs authentication, so CI runs only the node checks.
      # scripts/test.sh skips the validate step with a notice when `claude` is
      # not on PATH; run `claude plugin validate . --strict` locally before pushing.
      - name: Node checks
        run: bash scripts/test.sh
